[package]
name = "repub-web"
description = "Repub in the browser (WebAssembly): the desktop app, compiled for the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
repub-ui = { workspace = true }

# The same GUI framework as the desktop app, drawing with wgpu (over WebGL 2)
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = { version = "22", default-features = false, features = ["webgl"] }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

# Logging for WASM
log = "0.4"
wasm-logger = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
