[package]
name = "repub-web"
description = "Repub Web Application (WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
repub-model = { workspace = true }
repub-geometry = { workspace = true }
repub-color = { workspace = true }
repub-format-native = { workspace = true }
repub-export-vector = { workspace = true }
repub-fonts = { workspace = true }

# GUI framework (same as desktop, with web features)
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wgpu",
] }
egui = "0.29"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "CssStyleDeclaration",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "UrlSearchParams",
    "Navigator",
    "Storage",
    "Location",
    "Event",
    "EventTarget",
    "console",
] }

# Error handling for WASM
console_error_panic_hook = "0.1"

# Logging for WASM
log = "0.4"
wasm-logger = "0.2"

# Serialization
serde = { workspace = true }
serde_json = "1.0"



[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true

# Release size optimization is configured at the workspace root (see the
# `release` and `release-wasm` profiles there); per-package profiles are
# ignored by Cargo.
