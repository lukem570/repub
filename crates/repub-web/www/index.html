<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0E8F80">
    <meta name="description" content="Repub - Desktop publishing in your browser">
    
    <title>Repub</title>
    
    <!-- Trunk builds this crate to wasm and injects the loader -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A5C52 0%, #0E8F80 100%);
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        #loading p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            /* The app handles every pointer gesture itself: no browser drag-as-image,
               text selection, or touch panning/zooming over the canvas */
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            outline: none;
        }

        /* Prevent text selection on touch */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Allow text selection in input fields */
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>Repub</h1>
        <p>Loading application...</p>
        <div class="spinner"></div>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        // Trunk loads the wasm module, then fires this event; its exports are
        // on window.wasmBindings
        addEventListener('TrunkApplicationStarted', () => {
            try {
                const bindings = window.wasmBindings;
                console.log('Repub version:', bindings.version());
                bindings.start('canvas');
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                }, 500);
            } catch (error) {
                console.error('Failed to start Repub:', error);
                document.querySelector('#loading p').textContent =
                    'Failed to load. Please refresh the page.';
                document.querySelector('.spinner').style.display = 'none';
            }
        });

        // The canvas is the app, not content: no context menu, dragging it as an image, or
        // selecting it (which highlights it while the mouse drags across)
        const canvas = document.getElementById('canvas');
        canvas.draggable = false;
        for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
            canvas.addEventListener(type, e => e.preventDefault());
        }
        document.addEventListener('selectstart', e => {
            if (e.target === canvas || e.target === document.body) e.preventDefault();
        });
    </script>
</body>
</html>
