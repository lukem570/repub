[package]
name = "repub-cli"
description = "Command-line interface for Repub desktop publishing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "repub-cli"
path = "src/main.rs"

[dependencies]
repub-model = { workspace = true }
repub-geometry = { workspace = true }
repub-color = { workspace = true }
repub-format = { workspace = true }
repub-format-native = { workspace = true }
repub-export-vector = { workspace = true }
repub-export-raster = { workspace = true }
repub-fonts = { workspace = true }
repub-templates = { workspace = true }

# CLI framework
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# Output formatting
tabled = "0.17"
console = "0.15"
indicatif = "0.17"

# Interactive prompts
dialoguer = "0.11"

# Serialization for JSON output and config
serde = { workspace = true }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
