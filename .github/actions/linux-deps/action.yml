name: Linux system libraries
description: Install the libraries the desktop app (GTK menus, windowing, GL) needs to build on Ubuntu.

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libgtk-3-dev libxdo-dev libxkbcommon-dev libwayland-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb-render0-dev \
          libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libfontconfig1-dev
