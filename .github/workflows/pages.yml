name: Deploy to GitHub Pages

# Builds the WebAssembly app in crates/repub-web with Trunk and publishes it at
# https://<owner>.github.io/<repo>/. In the repository settings, Pages > Source
# must be "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: crates/repub-web
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      # Single-page app: unknown paths load the app instead of a GitHub 404
      - name: Add 404 page
        run: cp crates/repub-web/dist/index.html crates/repub-web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/repub-web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
